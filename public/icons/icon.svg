<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Frame with soft gold accent -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="#ffc107" stroke-width="4" />
  
  <!-- Outer Rotating Hub Ring (System Architecture motif) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffe066" stroke-width="2" stroke-dasharray="10 15" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="40 10" opacity="0.6" />

  <!-- Inner Core Hexagon (Database / API Hub) -->
  <polygon points="256,120 373,188 373,324 256,392 139,324 139,188" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)" />

  <!-- System Connection Nodes (Golden circles) -->
  <!-- Center Node -->
  <circle cx="256" cy="256" r="32" fill="url(#gold-grad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#09090b" />
  <circle cx="256" cy="256" r="6" fill="#ffe066" />

  <!-- Corner Nodes -->
  <circle cx="256" cy="120" r="12" fill="url(#gold-grad)" />
  <circle cx="373" cy="188" r="12" fill="url(#gold-grad)" />
  <circle cx="373" cy="324" r="12" fill="url(#gold-grad)" />
  <circle cx="256" cy="392" r="12" fill="url(#gold-grad)" />
  <circle cx="139" cy="324" r="12" fill="url(#gold-grad)" />
  <circle cx="139" cy="188" r="12" fill="url(#gold-grad)" />

  <!-- Connecting Architectures Lines -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="url(#gold-grad)" stroke-width="3" opacity="0.8" />
  <line x1="256" y1="256" x2="373" y2="188" stroke="url(#gold-grad)" stroke-width="3" opacity="0.8" />
  <line x1="256" y1="256" x2="373" y2="324" stroke="url(#gold-grad)" stroke-width="3" opacity="0.8" />
  <line x1="256" y1="256" x2="256" y2="392" stroke="url(#gold-grad)" stroke-width="3" opacity="0.8" />
  <line x1="256" y1="256" x2="139" y2="324" stroke="url(#gold-grad)" stroke-width="3" opacity="0.8" />
  <line x1="256" y1="256" x2="139" y2="188" stroke="url(#gold-grad)" stroke-width="3" opacity="0.8" />
  
  <!-- Classified Ad Motif (Abstract Card/Tag in core) -->
  <rect x="236" y="240" width="40" height="32" rx="4" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.9" transform="rotate(45, 256, 256)" />
</svg>
