<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with full coverage for maskable safe area -->
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full square background for masking -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad)" />

  <!-- Outer Ring (contained safely inside 80% safe zone) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffc107" stroke-width="3" opacity="0.8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffe066" stroke-width="1.5" stroke-dasharray="15 15" opacity="0.6" />

  <!-- Inner Hexagon Core -->
  <polygon points="256,130 365,193 365,319 256,382 147,319 147,193" fill="none" stroke="url(#gold-grad)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Center Node -->
  <circle cx="256" cy="256" r="28" fill="url(#gold-grad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="14" fill="#09090b" />

  <!-- Connection Nodes -->
  <circle cx="256" cy="130" r="10" fill="url(#gold-grad)" />
  <circle cx="365" cy="193" r="10" fill="url(#gold-grad)" />
  <circle cx="365" cy="319" r="10" fill="url(#gold-grad)" />
  <circle cx="256" cy="382" r="10" fill="url(#gold-grad)" />
  <circle cx="147" cy="319" r="10" fill="url(#gold-grad)" />
  <circle cx="147" cy="193" r="10" fill="url(#gold-grad)" />

  <!-- Connections -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.8" />
  <line x1="256" y1="256" x2="365" y2="193" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.8" />
  <line x1="256" y1="256" x2="365" y2="319" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.8" />
  <line x1="256" y1="256" x2="256" y2="382" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.8" />
  <line x1="256" y1="256" x2="147" y2="319" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.8" />
  <line x1="256" y1="256" x2="147" y2="193" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.8" />
</svg>
